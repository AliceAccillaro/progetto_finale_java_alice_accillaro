<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>

    <head th:insert="~{index :: navbar}"></head>

    <div class="container-fluid p-5 bg-secondary-subtle text-center">

        <div class="row justify-content-center">

            <div class="col-12">

                <span class="mt-5">
                    Dettaglio
                </span>

                <h2 th:text="${article.title}">
                    Titolo
                </h2>

            </div>

        </div>

    </div>


    <div class="container my-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 d-flex flex-column">

                <div
                    id="carouselExample"
                    class="carousel slide">

                    <div class="carousel-inner">

                        <div class="carousel-item active">

                            <img
                                th:if="${article.image != null}"
                                th:src="${article.image.path}"
                                class="card-img-top"
                                alt="...">

                            <img
                                th:unless="${article.image != null}"
                                th:src="@{/images/default.jpg}"
                                class="card-img-top"
                                alt="...">

                        </div>

                    </div>

                    <button
                        class="carousel-control-prev"
                        type="button"
                        data-bs-target="#carouselExample"
                        data-bs-slide="prev">

                        <span
                            class="carousel-control-prev-icon"
                            aria-hidden="true">
                        </span>

                        <span class="visually-hidden">
                            Previous
                        </span>

                    </button>

                    <button
                        class="carousel-control-next"
                        type="button"
                        data-bs-target="#carouselExample"
                        data-bs-slide="next">

                        <span
                            class="carousel-control-next-icon"
                            aria-hidden="true">
                        </span>

                        <span class="visually-hidden">
                            Next
                        </span>

                    </button>

                </div>


                <div class="text-center">

                    <h2 th:text="${article.subtitle}">
                        Sottotitolo
                    </h2>

                    <p
                        class="fs-5"
                        th:if="${article.category != null}">

                        Categoria:

                        <a
                            th:href="@{/categories/search/{id}(id=${article.category.id})}"
                            class="text-capitalize fw-bold text-muted"
                            th:text="${article.category.name}">
                            Categoria
                        </a>

                    </p>

                    <p
                        class="fs-5"
                        th:if="${article.category == null}">
                        Nessuna categoria
                    </p>


                    <div class="text-muted my-3">

                        <p>
                            Redatto il

                            <span th:text="${article.publishDate}">
                                data
                            </span>

                            da

                            <a
                                th:href="@{/search/{id}(id=${article.user.id})}"
                                class="text-muted">

                                <span th:text="${article.user.username}">
                                    User
                                </span>

                            </a>

                        </p>

                    </div>

                </div>

                <hr>

                <p th:text="${article.body}">
                </p>

                <div class="text-center">

                    <a
                        href="#"
                        class="text-secondary pointer"
                        onclick="goBack()">
                        Torna indietro
                    </a>

                </div>

            </div>

        </div>

    </div>


    <head th:insert="~{index :: footer}"></head>

    <script th:replace="~{index :: bootstrapScript}"></script>

    <script>
        function goBack() {
            window.history.back();
        }
    </script>

</body>

</html>
